# Sentinel-1 精密轨道下载配置文件
# 注意: ASF 下载使用的是 NASA Earthdata 账号(与 ASF Vertex 登录账号相同)
# 注册地址: https://urs.earthdata.nasa.gov/
 
[account]
# Earthdata / ASF 用户名
username = your_username
# Earthdata / ASF 密码
password = your_password
 
[paths]
# SLC 数据所在目录(自动递归扫描其中的 .zip 或 .SAFE 文件名)(不需要'')
slc_dir = '你的slc文件目录'
# 精密轨道文件保存目录(不存在会自动创建)(不需要'')
orbit_dir = '你的轨道数据存放文件目录'
 
[download]
# 并行下载数量
parallel = 4
# 单个文件下载失败后的重试次数
retry = 3
# 网络超时时间(秒)
timeout = 120
